<title>CONTROL v2 — Rediseño (verde, denso)</title>
<style>
  /* ============================================================
     CONTROL v2 — Prototipo de rediseño
     Dirección: ERP denso "tabla-first", verde de marca, riel oscuro.
     Tokens en :root; oscuro por @media y por data-theme (toggle).
     ============================================================ */

  :root {
    /* Superficies (claro) — neutros con leve sesgo verde */
    --bg: #f4f7f4;
    --panel: #ffffff;
    --panel-2: #fafbfa;
    --hover: #f1f5f2;
    --text: #101c16;
    --muted: #5b6b62;
    --faint: #8b988f;
    --border: #e3e9e4;
    --border-strong: #d2dbd5;

    /* Marca — verde pino/esmeralda (NO teal) */
    --brand: #0e7c47;
    --brand-hover: #0b6a3c;
    --brand-fg: #ffffff;
    --brand-soft: #e2f2e9;
    --brand-soft-fg: #0b6a3c;
    --brand-bright: #16a05c;

    /* Riel de navegación — verde muy oscuro (igual en ambos temas) */
    --rail-bg: #0b1712;
    --rail-panel: #0e1c15;
    --rail-fg: #aebfb5;
    --rail-fg-strong: #ecf3ef;
    --rail-active-fg: #55e39a;
    --rail-active-bg: rgba(52, 217, 138, 0.12);
    --rail-border: rgba(255, 255, 255, 0.07);

    /* Semánticos (separados del verde de marca) */
    --ok: #12864e;      --ok-soft: #e3f2e9;
    --warn: #b3790c;    --warn-soft: #f8efd6;
    --crit: #cf3b3f;    --crit-soft: #fbe3e3;
    --info: #2b7f9e;    --info-soft: #e0eef3;

    --shadow: 0 1px 2px rgba(10, 30, 20, 0.04), 0 8px 24px -12px rgba(10, 30, 20, 0.18);
    --shadow-lg: 0 24px 60px -20px rgba(8, 24, 16, 0.35);
    --radius: 9px;
    --radius-sm: 6px;
    --ff-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --ff-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a120e;
      --panel: #0f1813;
      --panel-2: #12211a;
      --hover: #16261d;
      --text: #e7efe9;
      --muted: #93a69b;
      --faint: #6f8377;
      --border: #1d2b23;
      --border-strong: #28382e;

      --brand: #22b56c;
      --brand-hover: #2cc678;
      --brand-fg: #04140c;
      --brand-soft: #12291d;
      --brand-soft-fg: #63e4a4;
      --brand-bright: #34d98a;

      --ok: #3ac081;      --ok-soft: #12291d;
      --warn: #d9a441;    --warn-soft: #2c2510;
      --crit: #e5686b;    --crit-soft: #2e1717;
      --info: #5ab4d1;    --info-soft: #112630;

      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
      --shadow-lg: 0 30px 70px -24px rgba(0,0,0,.7);
    }
  }
  /* Overrides explícitos del toggle (ganan a la media query en ambos sentidos) */
  :root[data-theme="light"] {
    --bg:#f4f7f4; --panel:#fff; --panel-2:#fafbfa; --hover:#f1f5f2;
    --text:#101c16; --muted:#5b6b62; --faint:#8b988f; --border:#e3e9e4; --border-strong:#d2dbd5;
    --brand:#0e7c47; --brand-hover:#0b6a3c; --brand-fg:#fff; --brand-soft:#e2f2e9; --brand-soft-fg:#0b6a3c; --brand-bright:#16a05c;
    --ok:#12864e; --ok-soft:#e3f2e9; --warn:#b3790c; --warn-soft:#f8efd6; --crit:#cf3b3f; --crit-soft:#fbe3e3; --info:#2b7f9e; --info-soft:#e0eef3;
    --shadow:0 1px 2px rgba(10,30,20,.04),0 8px 24px -12px rgba(10,30,20,.18); --shadow-lg:0 24px 60px -20px rgba(8,24,16,.35);
  }
  :root[data-theme="dark"] {
    --bg:#0a120e; --panel:#0f1813; --panel-2:#12211a; --hover:#16261d;
    --text:#e7efe9; --muted:#93a69b; --faint:#6f8377; --border:#1d2b23; --border-strong:#28382e;
    --brand:#22b56c; --brand-hover:#2cc678; --brand-fg:#04140c; --brand-soft:#12291d; --brand-soft-fg:#63e4a4; --brand-bright:#34d98a;
    --ok:#3ac081; --ok-soft:#12291d; --warn:#d9a441; --warn-soft:#2c2510; --crit:#e5686b; --crit-soft:#2e1717; --info:#5ab4d1; --info-soft:#112630;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 30px 70px -24px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--ff-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: color-mix(in srgb, var(--brand) 30%, transparent); }
  button { font-family: inherit; }
  h1,h2,h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--ff-mono); font-variant-numeric: tabular-nums; }

  /* ---------- App shell ---------- */
  .app {
    display: grid;
    grid-template-columns: var(--rail-w, 216px) 1fr;
    height: 100svh;
    overflow: hidden;
    transition: grid-template-columns .22s cubic-bezier(.4,0,.2,1);
  }
  .app.rail-collapsed { --rail-w: 62px; }

  /* ---------- Riel ---------- */
  .rail {
    background: var(--rail-bg);
    color: var(--rail-fg);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--rail-border);
    overflow: hidden;
  }
  .rail-head {
    display: flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 12px 0 14px;
    border-bottom: 1px solid var(--rail-border);
  }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(150deg, var(--brand-bright), var(--brand));
    color: #04140c; box-shadow: 0 4px 12px -4px rgba(34,181,108,.6);
  }
  .logo svg { width: 17px; height: 17px; }
  .brand-word { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; overflow: hidden; }
  .brand-word b { color: var(--rail-fg-strong); font-size: 14px; letter-spacing: .12em; font-weight: 700; }
  .brand-word span { color: var(--rail-fg); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; opacity: .7; }
  .rail-collapsed .brand-word, .rail-collapsed .rail-group-label, .rail-collapsed .nav-item span,
  .rail-collapsed .rail-user-meta, .rail-collapsed .nav-badge,
  .rail-collapsed .nav-caret, .rail-collapsed .nav-children { display: none; }
  .rail-collapsed .nav-parent { justify-content: center; }
  .rail-collapsed .rail-head { padding: 0; justify-content: center; }

  .rail-scroll { flex: 1; overflow-y: auto; padding: 8px 8px 12px; scrollbar-width: thin; }
  .rail-scroll::-webkit-scrollbar { width: 8px; }
  .rail-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 8px; }
  .rail-group-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .13em;
    color: #6a7d72; padding: 14px 10px 5px; font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    width: 100%; border: 0; background: transparent; cursor: pointer;
    color: var(--rail-fg); text-align: left;
    padding: 7px 10px; border-radius: 8px; font-size: 13px; position: relative;
    transition: background .12s, color .12s;
  }
  .rail-collapsed .nav-item { justify-content: center; padding: 9px 0; }
  .nav-item svg { width: 17px; height: 17px; flex: none; opacity: .9; }
  .nav-item span { flex: 1; white-space: nowrap; overflow: hidden; }
  .nav-item:hover { background: rgba(255,255,255,.05); color: var(--rail-fg-strong); }
  .nav-item.active { background: var(--rail-active-bg); color: var(--rail-active-fg); }
  .nav-item.active svg { opacity: 1; color: var(--rail-active-fg); }
  .nav-item.active::before {
    content:""; position:absolute; left:-8px; top:50%; transform: translateY(-50%);
    width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--brand-bright);
  }
  .nav-badge {
    margin-left: auto; font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 20px;
    background: rgba(255,255,255,.09); color: var(--rail-fg-strong);
  }
  .nav-badge.hot { background: color-mix(in srgb, var(--crit) 30%, transparent); color: #ffb4b4; }

  /* Desplegables del menú */
  .nav-caret { display: inline-flex; align-items: center; color: var(--rail-fg); opacity: .55; transition: transform .18s; }
  .nav-caret svg { width: 14px; height: 14px; }
  .nav-caret.open { transform: rotate(90deg); }
  .nav-parent.has-active { color: var(--rail-fg-strong); }
  .nav-children { display: flex; flex-direction: column; gap: 1px; max-height: 0; overflow: hidden; transition: max-height .22s ease; position: relative; margin-left: 18px; }
  .nav-children.open { max-height: 360px; }
  .nav-children::before { content: ""; position: absolute; left: 3px; top: 4px; bottom: 4px; width: 1px; background: var(--rail-border); }
  .nav-child {
    display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: transparent; cursor: pointer;
    color: var(--rail-fg); text-align: left; padding: 6px 10px 6px 14px; border-radius: 8px; font-size: 12.5px;
    transition: background .12s, color .12s;
  }
  .nav-child:hover { background: rgba(255,255,255,.05); color: var(--rail-fg-strong); }
  .nav-child.active { background: var(--rail-active-bg); color: var(--rail-active-fg); }
  .nav-child span:not(.nav-dot):not(.nav-badge) { flex: 1; white-space: nowrap; overflow: hidden; }
  .nav-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .45; flex: none; }
  .nav-child.active .nav-dot { opacity: 1; }

  .rail-foot { border-top: 1px solid var(--rail-border); padding: 8px; }
  .rail-user {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: 0; cursor: pointer; padding: 6px 8px; border-radius: 8px; color: var(--rail-fg);
  }
  .rail-user:hover { background: rgba(255,255,255,.05); }
  .rail-collapsed .rail-user { justify-content: center; }
  .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #04140c;
    background: linear-gradient(150deg, #7bd6a6, #2f9c66);
  }
  .rail-user-meta { text-align: left; line-height: 1.2; overflow: hidden; }
  .rail-user-meta b { color: var(--rail-fg-strong); font-size: 12.5px; font-weight: 600; display: block; white-space: nowrap; }
  .rail-user-meta span { color: var(--rail-fg); font-size: 11px; opacity: .7; }

  /* ---------- Zona principal ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .topbar {
    height: 52px; flex: none; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent;
    color: var(--muted); cursor: pointer; display: grid; place-items: center; flex: none;
    transition: background .12s, color .12s, border-color .12s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); border-color: var(--border); }
  .icon-btn svg { width: 17px; height: 17px; }
  .crumbs { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); min-width: 0; }
  .crumbs b { color: var(--text); font-weight: 600; }
  .crumbs .sep { opacity: .4; }

  .searchbox {
    margin-left: auto; display: flex; align-items: center; gap: 8px; cursor: text;
    width: min(340px, 34vw); height: 34px; padding: 0 10px; border-radius: 9px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--faint);
    transition: border-color .12s, background .12s;
  }
  .searchbox:hover { border-color: var(--border-strong); }
  .searchbox svg { width: 15px; height: 15px; }
  .searchbox span { flex: 1; font-size: 12.5px; }
  .kbd {
    font-family: var(--ff-mono); font-size: 11px; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  }
  .company {
    display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 10px; border-radius: 9px;
    background: var(--brand-soft); color: var(--brand-soft-fg); border: 1px solid transparent; font-weight: 600; font-size: 12.5px;
  }
  .company .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }

  .content { flex: 1; overflow-y: auto; position: relative; }
  .content-pad { padding: 20px 22px 40px; max-width: 1500px; }

  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
  .page-head h1 { font-size: 21px; font-weight: 680; }
  .page-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px;
    border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--panel); color: var(--text);
    transition: background .12s, border-color .12s, transform .05s;
  }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 15px; height: 15px; }
  .btn.primary { background: var(--brand); color: var(--brand-fg); border-color: transparent; box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--brand) 70%, transparent); }
  .btn.primary:hover { background: var(--brand-hover); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--hover); color: var(--text); }

  /* ---------- KPIs ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 14px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden;
  }
  .kpi .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .kpi .val { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi .val small { font-size: 14px; color: var(--muted); font-weight: 600; }
  .kpi .foot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
  .trend { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; }
  .trend.up { color: var(--ok); }
  .trend.down { color: var(--crit); }
  .trend svg { width: 12px; height: 12px; }
  .kpi .spark { position: absolute; right: 10px; bottom: 10px; opacity: .9; }

  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 1080px) { .grid-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .card-head h3 { font-size: 13.5px; font-weight: 650; }
  .card-head .hint { color: var(--faint); font-size: 11.5px; margin-left: auto; }

  /* ---------- Toolbar de tabla ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.active { background: var(--brand-soft); color: var(--brand-soft-fg); border-color: transparent; font-weight: 600; }
  .chip svg { width: 14px; height: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel-2); color: var(--muted); font-size: 12px; padding: 6px 11px; cursor: pointer; }
  .seg button.on { background: var(--brand); color: var(--brand-fg); font-weight: 600; }
  .tool-search {
    display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 9px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--faint); width: 200px;
  }
  .tool-search svg { width: 14px; height: 14px; }
  .tool-search input { border: 0; background: transparent; outline: none; color: var(--text); font-size: 12.5px; width: 100%; font-family: inherit; }
  .tool-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .count { color: var(--faint); font-size: 12px; }

  /* ---------- Tabla densa ---------- */
  .table-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data thead th {
    position: sticky; top: 0; z-index: 2; background: var(--panel-2);
    text-align: left; font-weight: 600; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: .04em; padding: 8px 12px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.data thead th.r, table.data td.r { text-align: right; }
  table.data tbody td { padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.data tbody tr { cursor: pointer; }
  table.data tbody tr:hover { background: var(--hover); }
  table.data tbody tr.sel { background: var(--brand-soft); }
  table.data tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
  .cell-strong { font-weight: 600; color: var(--text); }
  .cell-code { font-family: var(--ff-mono); font-size: 12px; color: var(--muted); }
  .cell-sub { color: var(--faint); font-size: 11.5px; }
  .cellflex { display: flex; align-items: center; gap: 9px; }
  .thumb {
    width: 30px; height: 30px; border-radius: 7px; flex: none; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 11px;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 600; border: 1px solid transparent;
  }
  .badge .d { width: 6px; height: 6px; border-radius: 50%; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.ok .d { background: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.warn .d { background: var(--warn); }
  .badge.crit { background: var(--crit-soft); color: var(--crit); }
  .badge.crit .d { background: var(--crit); }
  .badge.info { background: var(--info-soft); color: var(--info); }
  .badge.info .d { background: var(--info); }
  .badge.neutral { background: var(--hover); color: var(--muted); }
  .badge.neutral .d { background: var(--faint); }

  .swatches { display: inline-flex; }
  .swatches i { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--panel); margin-left: -5px; display: inline-block; }
  .swatches i:first-child { margin-left: 0; }
  .more-colors { font-size: 11px; color: var(--faint); margin-left: 4px; }

  .bar-mini { display: inline-flex; align-items: center; gap: 8px; }
  .bar-track { width: 62px; height: 6px; border-radius: 4px; background: var(--hover); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--brand); }

  /* ---------- Ruta crítica: lista lateral ---------- */
  .rc-list { padding: 6px; }
  .rc-item { display: flex; align-items: center; gap: 11px; padding: 9px 8px; border-radius: 8px; }
  .rc-item:hover { background: var(--hover); }
  .rc-sem { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .rc-main { min-width: 0; flex: 1; }
  .rc-main b { font-size: 12.5px; font-weight: 600; display: block; }
  .rc-main span { font-size: 11.5px; color: var(--muted); }
  .rc-when { font-size: 11.5px; font-weight: 600; white-space: nowrap; }

  /* barras horizontales (indicadores) */
  .hbars { display: flex; flex-direction: column; gap: 11px; padding: 13px 15px; }
  .hbar { display: grid; grid-template-columns: 130px 1fr 54px; align-items: center; gap: 11px; font-size: 12px; }
  .hbar .hlbl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar .htrack { height: 9px; border-radius: 5px; background: var(--hover); overflow: hidden; }
  .hbar .hfill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--brand), var(--brand-bright)); }
  .hbar .hval { text-align: right; font-family: var(--ff-mono); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* donut simple */
  .donut { width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .donut::after { content: ""; width: 74px; height: 74px; border-radius: 50%; background: var(--panel); }
  .donut .dc { position: absolute; text-align: center; }
  .donut .dc b { font-size: 20px; font-weight: 700; }
  .donut .dc span { font-size: 10.5px; color: var(--muted); display: block; }
  .legend { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  .legend .lg { display: flex; align-items: center; gap: 8px; }
  .legend .lg i { width: 10px; height: 10px; border-radius: 3px; }
  .legend .lg .lv { margin-left: auto; font-family: var(--ff-mono); font-variant-numeric: tabular-nums; color: var(--muted); }

  /* cadena de proceso (Ruta Crítica) */
  .chain { display: inline-flex; align-items: center; }
  .chain .node { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chain .lnk { width: 13px; height: 2px; flex: none; }

  /* tabs internas */
  .tabs { display: inline-flex; gap: 2px; background: var(--panel-2); padding: 3px; border-radius: 9px; border: 1px solid var(--border); }
  .tabs button { border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 7px; cursor: pointer; }
  .tabs button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }

  /* mini chart de barras */
  .chartbars { display: flex; align-items: flex-end; gap: 7px; height: 92px; padding: 10px 14px 4px; }
  .chartbars .b { flex: 1; background: linear-gradient(180deg, var(--brand-bright), var(--brand)); border-radius: 4px 4px 2px 2px; min-height: 4px; position: relative; }
  .chartbars .b.dim { background: var(--border-strong); }
  .chartbars .b:hover::after {
    content: attr(data-v); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    margin-bottom: 5px; background: var(--text); color: var(--bg); font-size: 10.5px; padding: 2px 6px; border-radius: 5px; white-space: nowrap;
  }
  .chartlabels { display: flex; gap: 7px; padding: 0 14px 12px; }
  .chartlabels span { flex: 1; text-align: center; font-size: 10.5px; color: var(--faint); }

  /* ---------- Placeholder módulos ---------- */
  .placeholder { display: grid; place-items: center; min-height: 60vh; text-align: center; }
  .placeholder .ph-ico { width: 56px; height: 56px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; margin: 0 auto 14px; }
  .placeholder .ph-ico svg { width: 26px; height: 26px; }
  .placeholder h2 { font-size: 17px; margin-bottom: 6px; }
  .placeholder p { color: var(--muted); max-width: 380px; margin: 0 auto; }

  /* ---------- Cajón de detalle (slide-over) ---------- */
  .scrim {
    position: absolute; inset: 0; background: rgba(6, 18, 12, 0.42); opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 30;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute; top: 0; right: 0; height: 100%; width: min(460px, 92vw);
    background: var(--panel); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg);
    transform: translateX(102%); transition: transform .26s cubic-bezier(.4,0,.2,1); z-index: 31;
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: none; }
  .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
  .drawer-body { overflow-y: auto; padding: 4px 18px 24px; }
  .drawer-foot { margin-top: auto; border-top: 1px solid var(--border); padding: 12px 18px; display: flex; gap: 8px; }
  .dt-hero { width: 46px; height: 46px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }
  .dsec { margin-top: 18px; }
  .dsec > h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 9px; font-weight: 600; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .field .k { font-size: 11px; color: var(--faint); margin-bottom: 2px; }
  .field .v { font-size: 13px; font-weight: 550; }
  .bom { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .bom-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; font-size: 12.5px; border-bottom: 1px solid var(--border); }
  .bom-row:last-child { border-bottom: 0; }
  .bom-tag { width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
  .bom-row .grow { flex: 1; min-width: 0; }
  .bom-row .qty { font-family: var(--ff-mono); font-variant-numeric: tabular-nums; color: var(--muted); }

  /* matriz color x talla mini */
  .matrix { overflow-x: auto; border: 1px solid var(--border); border-radius: 9px; }
  .matrix table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .matrix th, .matrix td { padding: 6px 9px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; }
  .matrix th { background: var(--panel-2); font-weight: 600; color: var(--muted); font-size: 11px; }
  .matrix td:first-child, .matrix th:first-child { text-align: left; position: sticky; left: 0; background: var(--panel-2); }
  .matrix td { font-family: var(--ff-mono); font-variant-numeric: tabular-nums; }
  .matrix td.z { color: var(--faint); }
  .matrix tr:last-child td { border-bottom: 0; }
  .matrix tr th:last-child, .matrix td:last-child { border-right: 0; }

  /* ---------- Command palette ---------- */
  .cmdk-scrim { position: fixed; inset: 0; background: rgba(6,18,12,.5); backdrop-filter: blur(2px); z-index: 90; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; }
  .cmdk-scrim.show { display: flex; }
  .cmdk { width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .cmdk-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .cmdk-input svg { width: 18px; height: 18px; color: var(--muted); }
  .cmdk-input input { border: 0; outline: 0; background: transparent; font-size: 15px; color: var(--text); width: 100%; font-family: inherit; }
  .cmdk-list { max-height: 320px; overflow-y: auto; padding: 6px; }
  .cmdk-sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 10px 10px 5px; font-weight: 600; }
  .cmdk-row { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .cmdk-row:hover, .cmdk-row.hl { background: var(--brand-soft); color: var(--brand-soft-fg); }
  .cmdk-row svg { width: 16px; height: 16px; opacity: .8; }
  .cmdk-row .r { margin-left: auto; font-size: 11px; color: var(--faint); }

  /* ---------- Órdenes: centro de comando (split lista + detalle) ---------- */
  .op-split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(360px, 1fr); gap: 14px; align-items: start; }
  .op-list { overflow: hidden; }
  .op-list .table-wrap { max-height: calc(100svh - 268px); overflow: auto; }
  table.data.op { font-size: 12px; }
  table.data.op td { padding: 6px 10px; }
  table.data.op th { padding: 7px 10px; }
  .op-detail { position: sticky; top: 2px; max-height: calc(100svh - 96px); overflow-y: auto; padding: 0; }
  @media (max-width: 1120px) { .op-split { grid-template-columns: 1fr; } .op-detail { position: static; max-height: none; } .op-list .table-wrap { max-height: 460px; } }

  .opd-head { display: flex; gap: 12px; align-items: flex-start; padding: 15px 16px 13px; border-bottom: 1px solid var(--border); }
  .opd-hero { width: 46px; height: 46px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; font-family: var(--ff-mono); background: linear-gradient(150deg, var(--brand-bright), var(--brand)); }
  .opd-title { display: flex; align-items: center; gap: 8px; }
  .opd-title h2 { font-size: 16px; font-weight: 680; }
  .opd-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; border-bottom: 1px solid var(--border); }
  .opd-act { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 4px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel-2); color: var(--muted); cursor: pointer; font-size: 10px; font-weight: 600; text-align: center; transition: background .12s, color .12s, border-color .12s; }
  .opd-act:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .opd-act svg { width: 17px; height: 17px; }
  .opd-body { padding: 2px 16px 18px; }
  .lockchip { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; color: var(--warn); background: var(--warn-soft); padding: 1px 5px; border-radius: 20px; font-weight: 600; text-transform: none; letter-spacing: 0; vertical-align: middle; }
  .lockchip svg { width: 10px; height: 10px; }
  .opd-photo-inner { border: 1.5px dashed var(--border-strong); border-radius: 11px; height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--faint); background: var(--panel-2); font-size: 11.5px; }
  .opd-photo-inner svg { width: 22px; height: 22px; opacity: .5; }
  .opd-photo-inner b { color: var(--muted); font-family: var(--ff-mono); font-size: 12px; }
  .matrix .mtot td { font-weight: 700; border-top: 2px solid var(--border-strong); background: var(--panel-2); }

  /* Detalle: bloque superior fijo (encabezado + botones) */
  .opd-top { position: sticky; top: 0; z-index: 6; background: var(--panel); border-bottom: 1px solid var(--border); }
  /* Precios editables + auditoría */
  .mini-edit { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 10px; font-weight: 600; color: var(--brand); background: transparent; border: 0; cursor: pointer; padding: 0; vertical-align: middle; }
  .mini-edit:hover { text-decoration: underline; }
  .mini-edit svg { width: 11px; height: 11px; }
  .tag-real { font-size: 9px; font-weight: 700; color: var(--ok); background: var(--ok-soft); padding: 1px 5px; border-radius: 20px; vertical-align: middle; }
  .tag-ref { font-size: 9px; font-weight: 700; color: var(--muted); background: var(--hover); padding: 1px 5px; border-radius: 20px; vertical-align: middle; }
  .audit { font-size: 10.5px; color: var(--faint); margin-top: 2px; }
  .audit-hint { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; }
  .audit-hint svg { width: 13px; height: 13px; flex: none; }

  /* Combobox con búsqueda por teclado (proveedores homónimos) */
  .combo { position: relative; }
  .combo-input { width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); font-size: 12.5px; font-family: inherit; outline: none; }
  .combo-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent); }
  .combo-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; background: var(--panel); border: 1px solid var(--border-strong); border-radius: 9px; box-shadow: var(--shadow-lg); max-height: 200px; overflow-y: auto; padding: 4px; display: none; }
  .combo-list.show { display: block; }
  .combo-opt { padding: 7px 9px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
  .combo-opt:hover { background: var(--brand-soft); color: var(--brand-soft-fg); }
  .combo-empty { padding: 8px 9px; font-size: 12px; color: var(--faint); }

  /* ---------- Pedidos: tabs de mes, filtros, tabla agrupada, totales ---------- */
  .monthbar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; }
  .mtab {
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    font-size: 12.5px; font-weight: 600; padding: 7px 15px; border-radius: 8px; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .mtab:hover { border-color: var(--border-strong); color: var(--text); }
  .mtab.on { background: var(--brand); color: var(--brand-fg); border-color: transparent; box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--brand) 70%, transparent); }

  .minisel {
    height: 30px; padding: 0 28px 0 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238b988f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center;
  }
  .minisel:hover { border-color: var(--border-strong); }

  table.data.pedidos tbody { border-bottom: 2px solid var(--border); }
  table.data.pedidos tbody:last-child { border-bottom: 0; }
  tr.grp { cursor: pointer; }
  tr.grp > td { background: var(--panel-2); padding-top: 9px; padding-bottom: 9px; border-bottom: 1px solid var(--border); }
  tr.grp:hover > td { background: var(--hover); }
  tr.grp b { color: var(--text); font-size: 13px; font-weight: 700; }
  .grp-tog { display: inline-flex; align-items: center; gap: 8px; }
  .grp-tog .chev { display: inline-flex; color: var(--muted); transform: rotate(90deg); transition: transform .18s; }
  .grp-tog .chev svg { width: 15px; height: 15px; }
  tbody.collapsed .grp-tog .chev { transform: rotate(0deg); }
  tbody.collapsed tr.sub { display: none; }
  .grp-count { font-size: 11px; color: var(--faint); font-weight: 600; background: var(--hover); padding: 1px 7px; border-radius: 20px; }
  tr.sub > td:first-child { padding-left: 14px; }
  .sub-mod { position: relative; padding-left: 22px; color: var(--text); font-size: 12.5px; }
  .sub-mod::before { content: ""; position: absolute; left: 7px; top: 50%; width: 8px; height: 1px; background: var(--border-strong); }
  tr.sub.sel > td { background: var(--brand-soft); }
  tr.sub.sel > td:first-child { box-shadow: inset 3px 0 0 var(--brand); }

  .totbar { display: flex; align-items: center; gap: 26px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel-2); flex-wrap: wrap; }
  .totitem { display: flex; flex-direction: column; gap: 0; }
  .totitem span { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; }
  .totitem b { font-size: 15px; font-weight: 700; }
  .totitem.grow { flex: 1; min-width: 0; }

  /* ---------- Avance de producción (Proceso) ---------- */
  .proc-scrim { position: fixed; inset: 0; background: rgba(6,18,12,.5); backdrop-filter: blur(2px); z-index: 97; display: none; }
  .proc-scrim.show { display: block; }
  .proc { position: absolute; top: 0; right: 0; height: 100%; width: min(960px, 97vw); background: var(--bg); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; transform: translateX(102%); transition: transform .26s cubic-bezier(.4,0,.2,1); }
  .proc-scrim.show .proc { transform: none; }
  .proc-head { display: flex; align-items: center; gap: 14px; padding: 15px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .proc-head .ph-hero { width: 46px; height: 46px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-family: var(--ff-mono); background: linear-gradient(150deg, var(--brand-bright), var(--brand)); }
  .proc-head h2 { font-size: 17px; font-weight: 680; }
  .proc-head .ph-meta { display: flex; gap: 14px; margin-top: 2px; font-size: 12px; color: var(--muted); }
  .proc-head .ph-meta b { color: var(--text); font-family: var(--ff-mono); }
  .proc-body { flex: 1; overflow-y: auto; padding: 18px 20px 28px; }

  .proc-steps { display: flex; margin-bottom: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .proc-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 6px; background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer; transition: background .12s; }
  .proc-step + .proc-step { border-left: 1px solid var(--border); }
  .proc-step:hover { background: var(--hover); }
  .proc-step .ps-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border-strong); }
  .proc-step.done .ps-dot { background: var(--ok); }
  .proc-step.partial .ps-dot { background: var(--warn); }
  .proc-step .ps-l { font-size: 11.5px; font-weight: 600; color: var(--muted); text-align: center; }
  .proc-step .ps-n { font-size: 11px; font-family: var(--ff-mono); color: var(--faint); }
  .proc-step.on { border-bottom-color: var(--brand); background: var(--brand-soft); }
  .proc-step.on .ps-l { color: var(--brand-soft-fg); }

  .proc-stage { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .proc-stage-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .proc-stage-head h3 { font-size: 14px; font-weight: 650; }
  .proc-note { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--info); background: var(--info-soft); padding: 3px 9px; border-radius: 20px; font-weight: 600; }
  .proc-note svg { width: 12px; height: 12px; }
  .proc-empty { padding: 24px; text-align: center; color: var(--faint); font-size: 12.5px; }

  .proc-capture { background: var(--panel-2); border-bottom: 1px solid var(--border); padding: 14px; }
  .pc-row { display: grid; grid-template-columns: 140px 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .pc-row.t4 { grid-template-columns: 140px 1fr 1fr 1fr; }
  .pc-row label { display: flex; flex-direction: column; gap: 5px; }
  .pc-row .ffk { font-size: 11px; color: var(--muted); font-weight: 600; }
  .pc-row input, .pc-row select { height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); font-size: 12.5px; font-family: inherit; outline: none; }
  .pc-row input:focus, .pc-row select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent); }
  .proc-matrix { overflow-x: auto; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); }
  .proc-matrix table { border-collapse: collapse; width: 100%; }
  .proc-matrix th, .proc-matrix td { padding: 5px 7px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; }
  .proc-matrix th { background: var(--panel-2); font-size: 11px; color: var(--muted); font-weight: 600; }
  .proc-matrix td:first-child, .proc-matrix th:first-child { text-align: left; white-space: nowrap; }
  .proc-matrix tr:last-child td { border-bottom: 0; }
  .proc-matrix th:last-child, .proc-matrix td:last-child { border-right: 0; }
  .procq { width: 52px; height: 30px; text-align: center; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--panel-2); color: var(--text); font-family: var(--ff-mono); font-size: 12px; outline: none; }
  .procq:focus { border-color: var(--brand); background: var(--panel); }
  .pc-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .pc-lock { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .pc-lock svg { width: 12px; height: 12px; }
  .pc-total { font-family: var(--ff-mono); font-weight: 700; color: var(--brand); }

  .proc-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin-top: 16px; }
  .psum { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .psum span { font-size: 10px; text-transform: uppercase; color: var(--faint); font-weight: 600; letter-spacing: .04em; }
  .psum b { display: block; font-size: 17px; font-weight: 700; margin-top: 1px; }
  .psum small { font-size: 11px; color: var(--muted); font-weight: 600; }
  .proc-summary-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 18px 0 2px; }

  /* ---------- Modal de formulario ---------- */
  .modal-scrim { position: fixed; inset: 0; background: rgba(6,18,12,.5); backdrop-filter: blur(2px); z-index: 95; display: none; align-items: flex-start; justify-content: center; padding: 7vh 16px 16px; }
  .modal-scrim.show { display: flex; }
  .modal { width: min(560px, 95vw); background: var(--panel); border: 1px solid var(--border-strong); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; max-height: 86vh; }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { font-size: 15px; font-weight: 650; flex: 1; }
  .modal-body { padding: 18px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .modal-foot { border-top: 1px solid var(--border); padding: 13px 18px; display: flex; gap: 8px; justify-content: flex-end; }
  .ff { display: flex; flex-direction: column; gap: 6px; }
  .ff.col2 { grid-column: span 2; }
  .ffk { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .ff input, .ff select {
    height: 36px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text); font-size: 13px; font-family: inherit; outline: none; width: 100%;
    transition: border-color .12s, box-shadow .12s;
  }
  .ff input::placeholder { color: var(--faint); }

  .ff select {

const NAV_LEAVES = NAV.flatMap(g => g.items.flatMap(it =>

/* ============================================================
   Render del menú (con desplegables)
   ============================================================ */
const navEl = document.getElementById('nav');
let vistaActual = 'resumen';
const gruposAbiertos = new Set(['g-produccion']); // pre-abre uno para mostrar el anidado

function renderNav() {
  navEl.innerHTML = NAV.map(g => {
    const lbl = g.grupo ? `<div class="rail-group-label">${g.grupo}</div>` : '';
    const items = g.items.map(it => {
      if (it.hijos) {
        const hijoActivo = it.hijos.some(h => h.clave === vistaActual);
        const abierto = gruposAbiertos.has(it.clave) || hijoActivo;
        return `
          <button class="nav-item nav-parent ${hijoActivo?'has-active':''}" data-toggle="${it.clave}" data-first="${it.hijos[0].clave}" title="${it.titulo}">
            ${it.icono}<span>${it.titulo}</span>
            ${it.badge ? `<span class="nav-badge ${it.hot?'hot':''}">${it.badge}</span>` : ''}
            <span class="nav-caret ${abierto?'open':''}">${IC.chevron}</span>
          </button>
          <div class="nav-children ${abierto?'open':''}">
            ${it.hijos.map(h => `<button class="nav-child ${h.clave===vistaActual?'active':''}" data-nav="${h.clave}">
              <span class="nav-dot"></span><span>${h.titulo}</span>${h.badge?`<span class="nav-badge">${h.badge}</span>`:''}
            </button>`).join('')}
          </div>`;
      }
      return `
        <button class="nav-item ${it.clave===vistaActual?'active':''}" data-nav="${it.clave}" title="${it.titulo}">
          ${it.icono}<span>${it.titulo}</span>
          ${it.badge ? `<span class="nav-badge ${it.hot?'hot':''}">${it.badge}</span>` : ''}
        </button>`;
    }).join('');
    return lbl + items;
  }).join('');
  navEl.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => ir(b.dataset.nav));
  navEl.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    if (app.classList.contains('rail-collapsed')) { ir(b.dataset.first); return; }
    const k = b.dataset.toggle;
    gruposAbiertos.has(k) ? gruposAbiertos.delete(k) : gruposAbiertos.add(k);
    renderNav();
  });
}

function opDetalle(o) {

function precioEditable(o, tipo) {
  const isMaq = tipo === 'maquila';
  const ref  = isMaq ? (o.pMaq ?? 25) : (o.pApp ?? 6);
  const real = isMaq ? o.pMaqReal : o.pAppReal;
  const by   = isMaq ? o.pMaqBy : o.pAppBy;
  const at   = isMaq ? o.pMaqAt : o.pAppAt;
  const val  = (real ?? ref);
  const label = isMaq ? 'Precio maquila' : 'Precio aplicación';
  return `<div class="field">
    <div class="k">${label}${PUEDE_PRECIOS?`<button class="mini-edit" onclick="abrirPrecioOP('${tipo}')">${IC.edit}editar</button>`:''}</div>

    ${by?`<div class="audit">capturó ${by} · ${at}</div>`:''}

}
function wireOrdenes() {

/* ============================================================
   Avance de producción (Proceso) — movimientos por etapa,
   multi-proveedor, captura por talla×color con candado, auto-RC.
   ============================================================ */
const USUARIO_ACTUAL = 'Daniel Masri';   // en real: sesión (better-auth)
const PUEDE_PRECIOS = true;              // en real: permiso RBAC (ordenes.precio.editar)
const CORTADORES = ['Óscar Jiménez','Óscar Hernández','Luis Ramírez','Bruno Salas','César Vega','Hugo Ortiz'];
const MAQUILEROS = ['Óscar Jiménez','Óscar Hernández','Óscar López','Confecciones León','Maquilas del Bajío','Rima Textil','Costura Express','Textil Guerra'];
const ESTAMPADORES = ['Estampados Rico','Serigrafía MX','DTF Pro'];
const BORDADORES = ['Bordados Fernando','Bordados Ignacio','Bordados Francisco'];

/* Combobox con búsqueda por teclado (para maquileros homónimos: Óscar J., Óscar H., …) */
const norm = (s) => (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function comboHTML(id, opts, ph) {
  return `<div class="combo" data-opts='${JSON.stringify(opts)}'><input class="combo-input" id="${id}" type="text" placeholder="${ph||'Escribe para buscar…'}" autocomplete="off"><div class="combo-list"></div></div>`;
}
function wireCombo(wrap) {
  const input = wrap.querySelector('.combo-input'), list = wrap.querySelector('.combo-list');
  const opts = JSON.parse(wrap.dataset.opts);
  const pinta = () => {
    const q = norm(input.value);
    const f = q ? opts.filter(o => norm(o).includes(q)) : opts;
    list.innerHTML = f.length ? f.map(o => `<div class="combo-opt">${o}</div>`).join('') : '<div class="combo-empty">Sin coincidencias</div>';
    list.querySelectorAll('.combo-opt').forEach(el => el.onmousedown = (ev) => { ev.preventDefault(); input.value = el.textContent; list.classList.remove('show'); });
  };
  input.onfocus = () => { pinta(); list.classList.add('show'); };
  input.oninput = () => { pinta(); list.classList.add('show'); };
  input.onblur  = () => setTimeout(() => list.classList.remove('show'), 130);
}
function abrirPrecioOP(tipo) {
  const o = OP[opSel];
  const isMaq = tipo === 'maquila';
  const ref = isMaq ? (o.pMaq ?? 25) : (o.pApp ?? 6);
  const real = isMaq ? o.pMaqReal : o.pAppReal;
  cerrarCajon(); cerrarCmdk();
  modalForm.dataset.key = 'precio:' + tipo;
  modalTitle.textContent = `Precio de ${isMaq?'maquila':'aplicación'} · OP ${o.op}`;
  modalBody.innerHTML = `
    <label class="ff"><span class="ffk">Precio de referencia (del modelo)</span><input value="$${(+ref).toFixed(2)}" disabled></label>
    <label class="ff"><span class="ffk">Precio real negociado ($) *</span><input name="real" type="number" step="any" min="0" value="${real??''}" required></label>
    <label class="ff col2"><span class="ffk">Negociado con</span>${comboHTML('precioProv', isMaq?MAQUILEROS:[...ESTAMPADORES,...BORDADORES], 'Escribe el proveedor…')}</label>
    <label class="ff col2"><span class="ffk">Nota</span><input name="nota" type="text" placeholder="Opcional"></label>
    <div class="ff col2 audit-hint">${IC.lock} Quedará registrado que lo capturó <b>${USUARIO_ACTUAL}</b> el ${hoyStr()}.</div>`;
  modalScrim.classList.add('show');
  modalBody.querySelectorAll('.combo').forEach(wireCombo);
  setTimeout(() => { const el = modalBody.querySelector('input[name=real]'); if (el) { el.focus(); el.select(); } }, 40);
}
function guardarPrecio(tipo) {
  const o = OP[opSel];
  const real = dec((modalBody.querySelector('input[name=real]')||{}).value);
  const prov = (document.getElementById('precioProv')||{}).value || '';
  if (tipo === 'maquila') { o.pMaqReal = real; o.pMaqBy = USUARIO_ACTUAL; o.pMaqAt = hoyStr(); o.pMaqProv = prov; }
  else { o.pAppReal = real; o.pAppBy = USUARIO_ACTUAL; o.pAppAt = hoyStr(); o.pAppProv = prov; }
  cerrarForm();
  const d = document.getElementById('opDetail'); if (d) d.innerHTML = opDetalle(o);
  mostrarToast(`Precio actualizado · registrado por ${USUARIO_ACTUAL}`);
}
const ETAPAS_PROC = [
  { k:'corte',    l:'Corte',              provL:'Cortador',  provs:CORTADORES,                    rc:'Corte' },
  { k:'entregaM', l:'Entrega a maquila',  provL:'Maquilero', provs:MAQUILEROS,                    rc:'Envío a maquila' },
  { k:'reciboM',  l:'Recibo de maquila',  provL:'Maquilero', provs:MAQUILEROS,                    rc:'Recibo de maquila' },
  { k:'entregaA', l:'Entrega aplicación', provL:'Aplicador', provs:[...ESTAMPADORES,...BORDADORES], tipo:true, rc:'Envío a aplicación' },
  { k:'reciboA',  l:'Recibo aplicación',  provL:'Aplicador', provs:[...ESTAMPADORES,...BORDADORES], tipo:true, rc:'Recibo de aplicación' },
];
const etapaDe = (k) => ETAPAS_PROC.find(e => e.k === k);
const stageTotal = (o, k) => (o.proc?.[k] || []).reduce((a,m)=>a+m.cant, 0);

function initProc(o) {
  if (o.proc) return;
  o.proc = { corte:[], entregaM:[], reciboM:[], entregaA:[], reciboA:[] };
  if (o.corte > 0) o.proc.corte.push({ fecha:o.fecha||hoyStr(), prov:o.maq||'Óscar Jiménez', cant:o.corte, by:'Daniel Masri', obs:'' });
  if (o.op === '5424') {
    const f = 1726;
    o.proc.entregaM.push({ fecha:'26-jun', prov:'Confecciones León', cant:f, by:'Daniel Masri', obs:'' });
    o.proc.reciboM.push({ fecha:'01-jul', prov:'Confecciones León', cant:f, by:'Laura Hernández', obs:'' });
    o.proc.entregaA.push({ fecha:'27-jun', prov:'Estampados Rico', tipo:'Estampado', cant:f, by:'Daniel Masri', obs:'' });
    o.proc.reciboA.push({ fecha:'02-jul', prov:'Estampados Rico', tipo:'Estampado', cant:f, by:'Laura Hernández', obs:'' });
  }
}

let procIdx = -1, procStage = 'corte', procFormOpen = false;
const procScrim = document.getElementById('procScrim');
const procPanel = document.getElementById('procPanel');

function abrirProceso(i) {
  procIdx = i; opSel = i; procStage = 'corte'; procFormOpen = false;
  initProc(OP[i]);
  renderProceso();
  procScrim.classList.add('show');
}
function cerrarProceso() {
  procScrim.classList.remove('show');
  if (vistaActual === 'ordenes') ir('ordenes');
}
function switchStage(k) { procStage = k; procFormOpen = false; renderProceso(); }
function toggleProcForm() { procFormOpen = !procFormOpen; renderProceso(); }
function procRecalc() {
  const t = [...document.querySelectorAll('.procq')].reduce((a,el)=>a+(parseInt(el.value,10)||0), 0);
  const el = document.getElementById('procTotal'); if (el) el.textContent = t.toLocaleString('es-MX');
}
function guardarMov() {
  const o = OP[procIdx], e = etapaDe(procStage);
  const cant = [...document.querySelectorAll('.procq')].reduce((a,el)=>a+(parseInt(el.value,10)||0), 0);
  if (cant <= 0) { mostrarToast('Captura al menos una cantidad'); return; }
  const mov = {
    fecha: document.getElementById('procFecha').value || hoyStr(),
    prov: document.getElementById('procProv').value || '—',
    cant, by: USUARIO_ACTUAL, obs: document.getElementById('procObs').value || '',
  };
  if (e.tipo) mov.tipo = document.getElementById('procTipo').value;
  o.proc[e.k].push(mov);
  if (e.k === 'corte') o.corte = stageTotal(o, 'corte');
  procFormOpen = false;
  renderProceso();
  mostrarToast(`${e.l} registrado · Ruta crítica actualizada ✓`);
}
function borrarMov(k, idx) {
  const o = OP[procIdx];
  o.proc[k].splice(idx, 1);
  if (k === 'corte') o.corte = stageTotal(o, 'corte');
  renderProceso();
}

function renderProceso() {
  const o = OP[procIdx], e = etapaDe(procStage);
  const tallas = opTallas(o), colores = opColores(o);
  const cortada = stageTotal(o,'corte'), entM = stageTotal(o,'entregaM'), recM = stageTotal(o,'reciboM');
  const entA = stageTotal(o,'entregaA'), recA = stageTotal(o,'reciboA');
  const st = (v) => v.toLocaleString('es-MX');
  const pasoEstado = (tot) => tot===0 ? '' : tot>=o.ord ? 'done' : 'partial';

  const steps = ETAPAS_PROC.map(x => {
    const tot = stageTotal(o, x.k);
    return `<button class="proc-step ${x.k===procStage?'on':''} ${pasoEstado(tot)}" onclick="switchStage('${x.k}')">
      <span class="ps-dot"></span><span class="ps-l">${x.l}</span><span class="ps-n">${st(tot)}/${st(o.ord)}</span>
    </button>`;
  }).join('');

  const movs = o.proc[e.k] || [];
  const lista = movs.length ? `<div class="table-wrap"><table class="data"><thead><tr>
      <th>Fecha</th><th>${e.provL}</th>${e.tipo?'<th>Tipo</th>':''}<th class="r">Cantidad</th><th>Capturó</th><th>Observaciones</th><th></th>
    </tr></thead><tbody>
      ${movs.map((m,idx)=>`<tr>
        <td class="num">${m.fecha}</td>
        <td class="cell-strong">${m.prov}</td>
        ${e.tipo?`<td><span class="badge ${m.tipo==='Bordado'?'info':'warn'}"><span class="d"></span>${m.tipo||'—'}</span></td>`:''}
        <td class="r num">${st(m.cant)}</td>
        <td class="cell-sub">${m.by||'—'}</td>
        <td class="cell-sub">${m.obs||'—'}</td>
        <td class="r"><button class="icon-btn" title="Quitar" onclick="borrarMov('${e.k}',${idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></td>
      </tr>`).join('')}
    </tbody></table></div>` : `<div class="proc-empty">Aún no se registra ${e.l.toLowerCase()} para esta orden.</div>`;

  const captura = procFormOpen ? `<div class="proc-capture">
    <div class="pc-row ${e.tipo?'t4':''}">
      <label><span class="ffk">Fecha</span><input id="procFecha" type="text" value="${hoyStr()}"></label>
      <label><span class="ffk">${e.provL}</span>${comboHTML('procProv', e.provs, 'Escribe el '+e.provL.toLowerCase()+'…')}</label>
      ${e.tipo?`<label><span class="ffk">Tipo</span><select id="procTipo"><option>Estampado</option><option>Bordado</option></select></label>`:''}
      <label><span class="ffk">Observaciones</span><input id="procObs" type="text" placeholder="Opcional"></label>
    </div>
    <div class="proc-matrix"><table>
      <thead><tr><th>Color</th>${tallas.map(t=>`<th>${t}</th>`).join('')}</tr></thead>
      <tbody>${colores.map((c,ci)=>`<tr><td><span style="display:inline-flex;align-items:center;gap:7px"><i style="width:11px;height:11px;border-radius:3px;background:${colorHex(c.n)};border:1px solid var(--border)"></i>${c.n}</span></td>${tallas.map((_,ti)=>`<td><input class="procq" type="number" min="0" placeholder="0" oninput="procRecalc()"></td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="pc-actions">
      <span class="pc-lock">${IC.lock} Candado: solo colores y tallas de la orden</span>
      <span class="pc-lock">Captura: <b>${USUARIO_ACTUAL}</b></span>
      <span style="margin-left:auto">Total capturado: <span class="pc-total" id="procTotal">0</span></span>
      <button class="btn ghost" onclick="toggleProcForm()">Cancelar</button>
      <button class="btn primary" onclick="guardarMov()">${IC.check}Guardar movimiento</button>
    </div>
  </div>` : '';

  procPanel.innerHTML = `
    <div class="proc-head">
      <div class="ph-hero">${o.modelo.slice(0,3)}</div>
      <div style="flex:1;min-width:0">
        <h2>Avance de producción · OP ${o.op}</h2>
        <div class="ph-meta"><span>Modelo <b>${o.modelo}</b></span><span>Pedido interno <b>${o.ped}-F</b></span><span>Cliente <b>${o.cli}</b></span></div>
      </div>
      <button class="btn ghost" style="color:var(--crit)" onclick="mostrarToast('Cancelar orden — demo')">Cancelar orden</button>
      <button class="icon-btn" onclick="cerrarProceso()" title="Cerrar (esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="proc-body">
      <div class="proc-steps">${steps}</div>
      <div class="proc-stage">
        <div class="proc-stage-head">
          <h3>${e.l}</h3>
          <span class="proc-note">${IC.rc} Se marca en Ruta Crítica automáticamente</span>
          <button class="btn primary" style="margin-left:auto" onclick="toggleProcForm()">${procFormOpen?IC.chevron:IC.plus}Registrar ${e.l.toLowerCase()}</button>
        </div>
        ${captura}
        ${lista}
      </div>

      <div class="proc-summary-title">Resumen · costura (maquila)</div>
      <div class="proc-summary">
        <div class="psum"><span>Ordenada</span><b class="num">${st(o.ord)}</b></div>
        <div class="psum"><span>Cortada</span><b class="num">${st(cortada)}</b><small>por cortar ${st(Math.max(0,o.ord-cortada))}</small></div>
        <div class="psum"><span>Entregada</span><b class="num">${st(entM)}</b><small>por entregar ${st(Math.max(0,cortada-entM))}</small></div>
        <div class="psum"><span>Recibida</span><b class="num">${st(recM)}</b><small>por recibir ${st(Math.max(0,entM-recM))}</small></div>
      </div>
      <div class="proc-summary-title">Resumen · estampado / bordado (aplicación)</div>
      <div class="proc-summary">
        <div class="psum"><span>Entregada</span><b class="num">${st(entA)}</b></div>
        <div class="psum"><span>Recibida</span><b class="num">${st(recA)}</b></div>
        <div class="psum"><span>Falta por recibir</span><b class="num" style="color:${entA-recA>0?'var(--warn)':'var(--ok)'}">${st(Math.max(0,entA-recA))}</b></div>
      </div>
    </div>`;
  procPanel.querySelectorAll('.combo').forEach(wireCombo);
}

function cadenaRC(pasos) {
  const col = { done:'var(--ok)', active:'var(--warn)', late:'var(--crit)', pending:'var(--border-strong)' };
  return `<span class="chain" title="${pasos.map(p=>p[0]).join(' → ')}">` + pasos.map((p,i)=>{
    const lnk = i ? `<span class="lnk" style="background:${pasos[i-1][1]==='done'?'var(--ok)':'var(--border-strong)'}"></span>` : '';
    const glow = p[1]==='active'||p[1]==='late' ? `box-shadow:0 0 0 3px color-mix(in srgb, ${col[p[1]]} 22%, transparent)` : '';
    return `${lnk}<span class="node" style="background:${col[p[1]]};${glow}"></span>`;
  }).join('') + `</span>`;
}

   ============================================================ */
const viewEl = document.getElementById('view');
const crumbsEl = document.getElementById('crumbs');
const contentEl = document.getElementById('content');

function ir(clave) {
  vistaActual = clave;
  renderNav();
  cerrarCajon();
  const fn = VISTAS[clave] || (()=>vPlaceholder(clave));
  viewEl.innerHTML = fn();
  crumbsEl.innerHTML = `<b>CONTROL</b><span class="sep">${IC.chevron}</span>${TITULOS[clave]}`;
  contentEl.scrollTop = 0;
  const cajon = CAJONES[clave];
  if (cajon) wireRows(cajon[0], tr => abrirCajon(cajon[1](+tr.dataset.row)));
  if (clave === 'pedidos') wirePedidos();
  if (clave === 'ordenes') wireOrdenes();
}

function wireRows(sel, handler) {
  document.querySelectorAll(sel + ' tbody tr').forEach(tr => {
    tr.onclick = () => {
      document.querySelectorAll(sel + ' tbody tr').forEach(x => x.classList.remove('sel'));
      tr.classList.add('sel');
      handler(tr);
    };
  });
}

/* ---- Cajón ---- */
const scrim = document.getElementById('scrim');
const drawer = document.getElementById('drawer');
function abrirCajon(html) {
  drawer.innerHTML = html;
  drawer.classList.add('show');
  scrim.classList.add('show');
  const c = drawer.querySelector('#closeDrawer');
  if (c) c.onclick = cerrarCajon;
}
function cerrarCajon() {
  drawer.classList.remove('show');
  scrim.classList.remove('show');
  document.querySelectorAll('.data tbody tr.sel').forEach(x => x.classList.remove('sel'));
}
scrim.onclick = cerrarCajon;

/* ---- Tema ---- */
const themeBtn = document.getElementById('themeToggle');
function temaVigente() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function pintarBotonTema() { themeBtn.innerHTML = temaVigente()==='dark' ? IC.sun : IC.moon; }
themeBtn.onclick = () => {
  const nuevo = temaVigente()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nuevo);
  pintarBotonTema();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', pintarBotonTema);

const cmdkScrim = document.getElementById('cmdkScrim');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
const COMANDOS = NAV_LEAVES.map(l => ({clave:l.clave, titulo:l.titulo, icono:l.icono||IC.resumen, grupo:l.grupo||'General'}));
const ORD_BUSCA = OP.map(o=>({op:o.op, modelo:o.modelo, cliente:o.cli}));

function renderCmdk(q='') {
  q = q.toLowerCase().trim();
  const mods = COMANDOS.filter(c => !q || c.titulo.toLowerCase().includes(q));
  const ords = q ? ORD_BUSCA.filter(o => o.op.toLowerCase().includes(q) || o.modelo.toLowerCase().includes(q) || o.cliente.toLowerCase().includes(q)) : [];
  let html = '';
  if (ords.length) {
    html += `<div class="cmdk-sec">Órdenes</div>` + ords.map(o=>`
      <div class="cmdk-row" data-go="ordenes">${IC.ordenes}<span><b>${o.op}</b> · ${o.modelo}</span><span class="r">${o.cliente}</span></div>`).join('');
  }
  html += `<div class="cmdk-sec">Ir a módulo</div>` + (mods.length?mods:COMANDOS).map(c=>`
    <div class="cmdk-row" data-go="${c.clave}">${c.icono}<span>${c.titulo}</span><span class="r">${c.grupo}</span></div>`).join('');
  cmdkList.innerHTML = html;
  cmdkList.querySelectorAll('[data-go]').forEach(r => r.onclick = () => { ir(r.dataset.go); cerrarCmdk(); });
  const first = cmdkList.querySelector('.cmdk-row'); if (first) first.classList.add('hl');
}
function abrirCmdk() { cmdkScrim.classList.add('show'); cmdkInput.value=''; renderCmdk(); setTimeout(()=>cmdkInput.focus(),30); }
function cerrarCmdk() { cmdkScrim.classList.remove('show'); }
document.getElementById('openCmdk').onclick = abrirCmdk;
cmdkInput.oninput = () => renderCmdk(cmdkInput.value);
cmdkScrim.onclick = (e) => { if (e.target===cmdkScrim) cerrarCmdk(); };
cmdkInput.onkeydown = (e) => {
  if (e.key==='Enter') { const hl = cmdkList.querySelector('.cmdk-row.hl'); if (hl){ ir(hl.dataset.go); cerrarCmdk(); } }
};
addEventListener('keydown', (e) => {
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); cmdkScrim.classList.contains('show')?cerrarCmdk():abrirCmdk(); }
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='b') { e.preventDefault(); app.classList.toggle('rail-collapsed'); }
  if (e.key==='Escape') { cerrarCmdk(); cerrarCajon(); }
});

/* ---- Toast demo en botones primarios ---- */
const toast = document.getElementById('toast');
let toastT;
function mostrarToast(msg) {
  toast.innerHTML = IC.check + `<span>${msg}</span>`;

}

/* ---- Modal ---- */
const modalScrim = document.getElementById('modalScrim');
const modalForm = document.getElementById('modalForm');
const modalBody = document.getElementById('modalBody');
const modalTitle = document.getElementById('modalTitle');

function renderCampo(c) {
  const opts = typeof c.op === 'function' ? c.op() : c.op;
  let ctrl;
  if (c.t === 'select') {
    ctrl = `<select name="${c.k}" ${c.req?'required':''}>` + (opts||[]).map(o => {
      const [val,lab] = Array.isArray(o) ? o : [o,o];
      return `<option value="${val}">${lab}</option>`;
    }).join('') + `</select>`;
  } else if (c.t === 'number') {
    ctrl = `<input name="${c.k}" type="number" step="any" min="0" inputmode="decimal" placeholder="${c.ph||''}" ${c.req?'required':''}>`;
  } else {
    ctrl = `<input name="${c.k}" type="text" placeholder="${c.ph||''}" ${c.req?'required':''}>`;
  }
  return `<label class="ff ${c.col===2?'col2':''}"><span class="ffk">${c.l}${c.req?' *':''}</span>${ctrl}</label>`;
}
function abrirForm(key) {
  const f = FORMS[key]; if (!f) return;
  cerrarCajon(); cerrarCmdk();
  modalForm.dataset.key = key;
  modalTitle.textContent = f.titulo;
  modalBody.innerHTML = f.campos.map(renderCampo).join('');
  modalScrim.classList.add('show');
  setTimeout(() => { const el = modalBody.querySelector('input,select'); if (el) el.focus(); }, 40);
}
function cerrarForm() { modalScrim.classList.remove('show'); }
function resaltarNueva() {
  const tr = document.querySelector('#view .data tbody tr');
  if (tr) { tr.classList.add('just-added'); setTimeout(() => tr.classList.remove('just-added'), 2100); }
}
modalForm.onsubmit = (e) => {
  e.preventDefault();
  if (modalForm.dataset.key && modalForm.dataset.key.startsWith('precio:')) { guardarPrecio(modalForm.dataset.key.split(':')[1]); return; }
  const f = FORMS[modalForm.dataset.key]; if (!f) return;
  const v = {}; new FormData(modalForm).forEach((val,k) => v[k] = String(val).trim());
  f.crear(v);
  cerrarForm();
  ir(f.vista);
  resaltarNueva();
  mostrarToast(f.exito || 'Registro creado');
};
document.getElementById('modalClose').onclick = cerrarForm;
document.getElementById('modalCancel').onclick = cerrarForm;
modalScrim.onclick = (e) => { if (e.target === modalScrim) cerrarForm(); };

/* ---- Clic global: alta o toast demo ---- */
document.addEventListener('click', (e) => {
  const add = e.target.closest('[data-add]');
  if (add) { abrirForm(add.dataset.add); return; }
  const b = e.target.closest('.btn.primary');
  if (b && !b.hasAttribute('onclick') && !e.target.closest('.modal, .cmdk, .proc')) mostrarToast(b.textContent.trim() + ' — demo');
});
procScrim.onclick = (e) => { if (e.target === procScrim) cerrarProceso(); };
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (procScrim.classList.contains('show')) cerrarProceso();
  else cerrarForm();
});
