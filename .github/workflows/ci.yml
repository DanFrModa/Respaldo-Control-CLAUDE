# CI bloqueante de CONTROL v2 (PLANMAESTRO.md §9.3: nada se mergea en rojo).
#
# Arquitectura nueva (E1-E5): dos servicios npm autonomos y dockerizados —
# backend/ (Fastify + Prisma + OpenAPI) y frontend/ (Vite + React, servido por
# nginx). NO es monorepo: cada carpeta tiene su package.json y su lockfile, asi
# que cada servicio se valida en su propio job, en paralelo.
#
# Corre en push y en pull_request hacia `prueba` y `main` (el flujo de ramas del
# plan §2.4: rama de tarea -> PR a prueba -> PR a main). Sin filtro `paths`: la
# raiz del repo ES el proyecto, asi que cualquier cambio debe pasar el CI antes
# de entrar a una rama protegida.
#
# Jobs (todos bloqueantes):
#   - backend           npm ci -> lint -> typecheck -> format:check -> test -> build -> openapi (gate)
#   - frontend          npm ci -> gen:api (gate) -> typecheck -> lint -> format:check -> test -> build
#   - imagenes-docker   docker build de las dos imagenes (mismo artefacto que produccion)
#   - e2e               docker compose up + Playwright contra el stack real, y down
#
# Notas tecnicas:
#   - Node 22 (engines ">=22" en ambos package.json).
#   - El `postinstall` del backend corre `prisma generate`; prisma.config.ts usa
#     un DATABASE_URL placeholder cuando la variable falta, asi que `npm ci`
#     funciona sin base de datos.
#   - Las pruebas de integracion del backend levantan su propio Postgres 17 con
#     testcontainers (no hace falta `services:`); los runners ubuntu-latest traen
#     Docker. Por eso `backend` necesita el runner Linux con Docker, no un
#     servicio de Postgres aparte.
#   - El frontend genera su cliente del contrato con `gen:api` leyendo
#     ../backend/openapi.json (versionado); el checkout trae ambas carpetas.

name: CI

on:
  push:
    branches: [prueba, main]
  pull_request:
    branches: [prueba, main]

# Un PR/rama en vuelo cancela su corrida anterior (ahorra minutos de runner).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permiso minimo: solo leer el repo (no publicamos imagenes ni tocamos releases).
permissions:
  contents: read

jobs:
  # ── Backend: API Fastify (lint, types, formato, tests, build) ──────────────
  backend:
    name: backend
    runs-on: ubuntu-latest
    # 45 (25-ago-2026). ⚠️ ES LA SEGUNDA VEZ QUE PASA ESTO — la nota de abajo se conserva porque
    # cuenta la primera, idéntica: la suite crece, el techo se queda, y el fallo NO se ve como lo
    # que es.
    #
    # 🔴 CÓMO SE VE, Y POR QUÉ ENGAÑA: al agotarse `timeout-minutes`, GitHub marca el job como
    # **`cancelled`**, exactamente igual que si alguien hubiera matado la corrida a mano o la
    # hubiera pisado un push nuevo. El 25-ago costó TRES ciclos y dos diagnósticos equivocados
    # (se culpó a un push propio y a un merge a `main`) antes de que alguien midiera la duración
    # y viera que las tres «cancelaciones» duraron **exactamente 30 minutos**.
    #
    # ⇒ **Ante un `cancelled` en este job, lo PRIMERO es mirar cuánto duró.** Si roza el tope,
    # es el reloj, no interferencia.
    #
    # LA MEDICIÓN (25-ago): las corridas verdes recientes tardaron **25-26 min** contra un techo de
    # 30 ⇒ apenas ~15 % de margen, y cualquier runner degradado lo rebasa. No hubo regresión de
    # rendimiento: entre la corrida de 25.6 min que pasó y las que se pasaron de 30, lo único que
    # cambió fueron archivos del FRONTEND, que este job ni toca. Es varianza del runner comiéndose
    # un margen que ya era demasiado estrecho.
    #
    # LA REGLA, para no repetirlo una tercera vez: **el tope se mantiene en ~1.7× la duración sana**
    # (25 min → 45). Subirlo NO hace la suite más rápida — eso es deuda aparte, anotada en
    # `HOJA-DE-RUTA.md` §4: 25 min de backend es mucho, y la culpa está en el arranque repetido de
    # testcontainers.
    #
    # 🔴 Y LO QUE SE APRENDIÓ AL SUBIRLO (mismo 25-ago, horas después): **un tope de tiempo puede
    # estar TAPANDO un fallo de verdad.** Al pasar de 30 a 45 la corrida por fin llegó al final…
    # y murió de MEMORIA en el paso de build. El OOM llevaba ahí abajo todo el tiempo, escondido
    # detrás del reloj: mientras el job moría a los 30 min, nadie podía ver el paso que reventaba.
    # ⇒ Subir un tope NUNCA es "arreglar": es **destapar**. Después de subirlo, hay que volver a
    # mirar la corrida completa, no darla por buena.
    #
    # 🔎 CÓMO SE RECONOCE UN OOM (para no volver a confundirlo): el job sale con **exit code 134**
    # (128+6, SIGABRT) y el log trae `FATAL ERROR: ... JavaScript heap out of memory`,
    # `Ineffective mark-compacts near heap limit` y `Aborted (core dumped)`. Nada de eso se parece
    # a un fallo de prueba.
    #
    # 🔎 Y ANTES DE CULPAR A LAS PRUEBAS, MIRAR **QUÉ PASO** FALLÓ. Que el job se llame `backend`
    # no quiere decir que fallara la suite: en la corrida del OOM las pruebas salieron **VERDES,
    # 305 archivos y 4,241 pruebas**, y la muerte fue DOS PASOS después, en `npm run build`. Se
    # perdió tiempo buscando fugas de memoria en las pruebas de integración —que no tenían
    # ninguna— porque se leyó el fallo del job sin mirar en qué paso ocurrió.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      # Valores dummy SOLO para que los tests/seed que tocan auth o R2 carguen su
      # config sin fallar en CI. Los reales viven en Railway (ver
      # docs/GUIA-RAILWAY-R2.md). NO usar estos en ningun ambiente real.
      BETTER_AUTH_SECRET: ci-secret-solo-para-ci-no-usar-en-railway
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 22 + cache de npm
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` dispara el `postinstall` (prisma generate) — no necesita BD.
      - name: Instalar dependencias (lockfile)
        run: npm ci

      # El lint con tipos crece con el proyecto: con el heap por defecto de Node
      # (~4 GB) el runner murió con "JavaScript heap out of memory" (6-ago-2026).
      - name: Lint (eslint)
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # MISMA causa que el lint, diez días después (16-ago-2026): `tsc --noEmit`
      # murió con OOM (exit 134) en el runner. En su momento se le subió el heap
      # SOLO al lint, y el typecheck se quedó con el default — así que la cicatriz
      # se repitió un paso más abajo.
      #
      # No lo disparó una etapa concreta: medido con `--extendedDiagnostics`,
      # `prueba` ya pedía 5.22 GB y la rama que reventó, 5.28 GB (+1 %). El
      # proyecto lleva tiempo al filo: 2,614 archivos, 3.5 M de tipos y 19.7 M de
      # instanciaciones (Prisma + Zod generan tipos enormes).
      #
      # ⚠️ Esto NO es la cura, es la venda: cada etapa suma tipos y el techo del
      # runner no se mueve. Cuando 6 GB no alcancen, hay que ATACAR LA CAUSA
      # (proyectos de TS separados / `--build` incremental / adelgazar los tipos
      # generados), no volver a subir el número. Deuda en `HOJA-DE-RUTA.md` §4.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Formato (prettier --check)
        run: npm run format:check

      # Cliente PostgreSQL 17 para las pruebas del SEGUNDO RESPALDO a R2 (V1-E6a): el Postgres efimero de
      # testcontainers es 17 y `pg_dump` se NIEGA a volcar un servidor mas nuevo que el (el runner
      # de GitHub trae el 16). Sin este paso, el ENSAYO DE RESTAURACION se salta con aviso y nadie
      # verifica que el respaldo se pueda restaurar — que es la mitad del valor de esa etapa. Es el
      # mismo paquete que instala la imagen de produccion (backend/Dockerfile).
      #
      # Con REINTENTOS (3 intentos, espera creciente): este repo ya carga cicatrices de CI rojo
      # cronico, y un hipo de apt.postgresql.org no puede bloquear PRs ajenos. Si tras los tres
      # intentos sigue sin instalarse, el job SI falla: las pruebas del respaldo estan configuradas
      # para caer (no para saltarse) cuando corren en CI sin cliente compatible.
      #
      # ⚠️ INSTALAR LA 17 NO BASTA — LA TRAMPA DEL WRAPPER DE DEBIAN (PR #184, CI en rojo):
      # `/usr/bin/pg_dump` NO es el binario, es un WRAPPER de `postgresql-client-common` que elige
      # la version segun el cluster/version por defecto. Con la 16 (preinstalada en el runner) y la
      # 17 (recien puesta) conviviendo, el wrapper se quedaba con la 16 aunque los binarios de la 17
      # estuvieran en /usr/lib/postgresql/17/bin: las pruebas caian con "pg_dump 16.14 es mas viejo
      # que el servidor 17.11". Por eso se antepone el directorio de la 17 al PATH del job. Y por eso
      # el `pg_dump --version` que cerraba este paso NO delataba nada: el wrapper contestaba 16 y el
      # paso salia con exito — la misma clase de "verificacion que no verifica" que esta etapa vino
      # a eliminar. Ahora se COMPRUEBA la major y, si no es 17, el paso falla diciendo por que.
      #
      # ⏱️ Y LOS REINTENTOS NO SALVAN DE UN CUELGUE (V1-E3i — se colgo DOS VECES la noche del
      # 19-ago: 32 min y 23 min contra los ~11 s que tarda cuando funciona, y hubo que cancelar y
      # relanzar a mano). El bucle de abajo atrapa FALLOS, no cuelgues: `apt-get` sin limite de
      # tiempo simplemente NUNCA REGRESA si la red se pasma a media descarga, asi que el reintento
      # jamas llega a ejecutarse. Era una defensa escrita para "falla y reintento" contra un mundo
      # que hace "no contesta nunca".
      # El arreglo: cada comando de red lleva su tope (`timeout` en apt, `--max-time` en curl) para
      # que un cuelgue SE VUELVA UN FALLO y el reintento que ya existe haga su trabajo. `timeout`
      # devuelve 124 al cortar, y como los comandos van dentro de un `if` eso NO aborta el paso pese
      # a `set -e` (la condicion de un `if` esta exenta): cuenta como intento fallido, que es
      # justo lo que se quiere. Y `timeout-minutes` en el paso es el cinturon: aunque se cuelgue
      # algo que no previmos, no vuelve a comerse media hora del runner.
      - name: Cliente PostgreSQL 17 (pruebas de respaldo/restauracion)
        timeout-minutes: 10
        run: |
          set -e
          sudo install -d /usr/share/postgresql-common/pgdg
          for intento in 1 2 3; do
            if sudo curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 120 \
                 https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc; then
              break
            fi
            echo "Descarga de la llave PGDG fallida (intento $intento/3); reintento..."
            sleep $((intento * 10))
          done
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          instalado=0
          for intento in 1 2 3; do
            # `timeout` va DENTRO de sudo para que corra como root y pueda matar a su hijo.
            if sudo timeout 180 apt-get update && sudo timeout 180 apt-get install -y --no-install-recommends postgresql-client-17; then
              instalado=1
              break
            else
              # El codigo se lee DENTRO del else: despues de `fi`, `$?` es el del `if` (0) y no el
              # del comando que fallo — se veria siempre "codigo 0" y el 124 no se distinguiria.
              codigo=$?
              if [ "$codigo" -eq 124 ]; then
                echo "apt se COLGO y se corto por tiempo (intento $intento/3); reintento..."
              else
                echo "apt fallo con codigo $codigo (intento $intento/3); reintento..."
              fi
            fi
            sleep $((intento * 15))
          done
          if [ "$instalado" -ne 1 ]; then
            echo "No se pudo instalar postgresql-client-17 tras 3 intentos."
            exit 1
          fi

          # Los binarios REALES de la 17, sin pasar por el wrapper.
          BIN17=/usr/lib/postgresql/17/bin
          if [ ! -x "$BIN17/pg_dump" ]; then
            echo "postgresql-client-17 se instalo pero no existe $BIN17/pg_dump."
            exit 1
          fi
          # Comprobacion REAL de la major (antes solo se imprimia y siempre pasaba).
          mayor="$("$BIN17/pg_dump" --version | sed -nE 's/.*\(PostgreSQL\) ([0-9]+).*/\1/p')"
          if [ "$mayor" != "17" ]; then
            echo "Se esperaba pg_dump 17 en $BIN17 y se encontro la $mayor:"
            "$BIN17/pg_dump" --version
            exit 1
          fi

          # Se antepone al PATH del JOB (afecta a los pasos SIGUIENTES, no a este) para que
          # `pg_dump`, `pg_restore` y `psql` resuelvan a la 17 y no al wrapper que elige la 16.
          echo "$BIN17" >> "$GITHUB_PATH"
          echo "Instalado y verificado: $("$BIN17/pg_dump" --version)"

      # El estado que de verdad importa: que `pg_dump` A SECAS —tal como lo invoca el codigo del
      # respaldo— sea la 17 en los pasos siguientes. Va en su propio paso porque `GITHUB_PATH` no
      # aplica al paso que lo escribe. Si el wrapper volviera a ganar, esto falla AQUI, con el
      # diagnostico servido, en vez de reventar mas tarde dentro de la suite.
      - name: Verificar que `pg_dump` del PATH es la 17
        run: |
          set -e
          echo "which pg_dump  -> $(which pg_dump)"
          pg_dump --version
          mayor="$(pg_dump --version | sed -nE 's/.*\(PostgreSQL\) ([0-9]+).*/\1/p')"
          if [ "$mayor" != "17" ]; then
            echo "⛔ El pg_dump del PATH es la $mayor, no la 17: el wrapper de Debian"
            echo "   (/usr/bin/pg_dump) esta ganando y el ENSAYO DE RESTAURACION fallaria."
            echo "   Revisa que el paso anterior haya escrito /usr/lib/postgresql/17/bin en GITHUB_PATH."
            exit 1
          fi
          # pg_restore y psql los usa el script de restauracion: se comprueba su VERSION, no su
          # ruta. Afirmar la ruta seria fragil (ata la prueba a donde instale hoy el paquete) y
          # ademas no es lo que importa — lo que rompe el ensayo es la major, no el directorio.
          for herramienta in pg_restore psql; do
            suya="$($herramienta --version | sed -nE 's/.*\(PostgreSQL\) ([0-9]+).*/\1/p')"
            if [ "$suya" != "17" ]; then
              echo "⛔ $herramienta del PATH es la $suya, no la 17 ($(which $herramienta))."
              exit 1
            fi
            echo "$herramienta -> $(which $herramienta) (major $suya)"
          done

      # `test` corre los dos proyectos de vitest: "unit" (sin BD) e "integracion"
      # (Postgres 17 efimero via testcontainers, usando el Docker del runner).
      - name: Tests (unit + integracion)
        run: npm test

      # `build` compila TypeScript a dist/ (no toca openapi.json).
      #
      # 🔴 TERCERA VEZ DE LA MISMA CICATRIZ (25-ago-2026) — lint (6-ago), typecheck (16-ago) y
      # ahora el build. El patrón que se repite NO es "a tsc le falta memoria": es que **se le
      # sube el heap al paso que reventó y se dejan sus HERMANOS en el default**, así que la
      # cicatriz reaparece un paso más abajo. `npm run build` era el último tsc sin techo.
      #
      # LA MEDICIÓN (`tsc -p tsconfig.build.json --extendedDiagnostics`, misma metodología que la
      # nota del typecheck): 2,106 archivos, 3.52 M de tipos, 19.9 M de instanciaciones,
      # **5,144,812K ≈ 5.03 GB**. O sea el build pesa PRÁCTICAMENTE LO MISMO que el typecheck
      # (5.22-5.28 GB), que lleva 6144 desde el 16-ago. No hay razón para que uno tenga techo y el
      # otro no: es el mismo compilador sobre el mismo árbol, y el build encima emite.
      #
      # DÓNDE ESTÁ EL FILO, medido a mano bisecando el heap con el MISMO comando del CI
      # (`node --max-old-space-size=N node_modules/typescript/bin/tsc -p tsconfig.build.json`):
      # **2048 → muere (exit 134, reproduce el fallo del CI clavado) · 3072 → muere · 4096 → pasa ·
      # 6144 → pasa**. Léase con cuidado: el default de Node en un runner GRANDE ronda los 4 GB, o
      # sea que el build venía pasando **por un pelo** y en el chico (~2 GB) no tenía ninguna
      # posibilidad. Por eso 6144 y no 4096: 4 GB es justo el borde donde V8 ya entra en
      # mark-compacts inútiles, y el número se elige con ~50 % de aire sobre el borde medido —
      # además de quedar igual que el del typecheck, que es lo que evita la próxima asimetría.
      #
      # NO LO DISPARÓ NINGÚN CAMBIO NUESTRO, y esto importa: entre la corrida que compiló en VERDE
      # (`ed99245`, build en 73 s) y la que murió (`92325fd`) **no se tocó un solo archivo del
      # backend** — `git diff --stat ed99245 92325fd -- backend/src` sale vacío; lo único que
      # cambió fue ci.yml, docs y frontend, que este job ni compila. Lo que cambió fue el RUNNER:
      # en la corrida que murió el heap tope era ~2 GB (murió en 2040 de 2082 MB) y las pruebas
      # tardaron 28 min contra 20 min de la verde — las dos señales de un runner más chico/lento.
      # Con el default de Node atado al tamaño de la máquina, el mismo commit compila o revienta
      # según qué runner toque. Fijar el techo aquí quita esa lotería.
      #
      # ⚠️ ESTO ES LA VENDA, NO LA CURA — igual que en lint y typecheck: el número no arregla que
      # el proyecto genere 3.5 M de tipos, sólo deja de depender del azar. La cura (proyectos de
      # TS separados / `--build` incremental / adelgazar los tipos de Prisma+Zod) sigue siendo la
      # deuda ya anotada en `HOJA-DE-RUTA.md` §4. Cuando 6 GB no alcancen, se ataca ESO; no se
      # vuelve a subir el número.
      #
      # LA REGLA, para que no haya una cuarta vez: **todo paso que corra tsc o eslint sobre el
      # árbol completo lleva este mismo `NODE_OPTIONS`.** Hoy son tres (lint, typecheck, build);
      # el que agregue un cuarto, se lo pone. Va paso por paso y NO a nivel de job a propósito:
      # el paso de pruebas lanza procesos hijos (vitest forkea un worker por archivo) y cada hijo
      # heredaría el mismo techo — dos procesos autorizados a 6 GB en un runner de 8 GB cambian un
      # OOM limpio de V8 por una muerte del OOM-killer del kernel, que es mucho peor de diagnosticar.
      - name: Build (tsc)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Regenera el contrato desde los MISMOS esquemas Zod de las rutas
      # (`npm run openapi` ejecuta scripts/generar-openapi.ts). El paso siguiente
      # falla si el openapi.json versionado no coincide con lo que produce el
      # codigo actual — p. ej. si alguien cambio un Zod y no regenero el contrato.
      - name: Regenerar el contrato OpenAPI
        run: npm run openapi

      - name: Verificar que openapi.json esta al dia
        run: git diff --exit-code openapi.json

  # ── Frontend: SPA Vite/React (cliente del contrato, lint, tests, build) ────
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 22 + cache de npm
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (lockfile)
        run: npm ci

      # Regenera el cliente tipado desde ../backend/openapi.json (versionado).
      - name: Generar cliente del API (gen:api)
        run: npm run gen:api

      # El cliente y la copia del contrato se commitean: si gen:api los cambia,
      # es que el frontend no estaba sincronizado con el contrato del backend.
      - name: Verificar que el cliente del API esta sincronizado
        run: git diff --exit-code openapi.json src/api/esquema.gen.ts

      - name: Typecheck (tsc -b)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Formato (prettier --check)
        run: npm run format:check

      - name: Tests (vitest)
        run: npm test

      - name: Build (tsc + vite build)
        run: npm run build

  # ── Imagenes Docker: el artefacto que se despliega en Railway ──────────────
  # Construye ambas imagenes igual que produccion. Depende de que backend y
  # frontend pasen primero (no tiene sentido gastar minutos si el codigo no
  # compila). Build con cache de GitHub Actions para acelerar corridas.
  imagenes-docker:
    name: imagenes-docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build imagen backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: control-v2-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build imagen frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: control-v2-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ── E2E: el stack completo levantado con docker compose + Playwright ───────
  # Reproduce el "docker compose up" que verifica Gabriel: postgres -> backend
  # (migra + siembra) -> frontend (nginx). Playwright corre contra :8080 (login,
  # menu por permisos, CRUD de Almacenes). Es la red de seguridad de que el
  # artefacto real funciona, no solo las piezas por separado.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 22 + cache de npm
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend (Playwright)
        working-directory: frontend
        run: npm ci

      - name: Instalar navegador de Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Levanta todo el stack. Los healthchecks del compose ordenan el arranque:
      # postgres healthy -> backend migra/siembra y queda healthy -> frontend.
      - name: Levantar el stack (docker compose up)
        run: docker compose up -d --build

      # Espera activa a que el frontend responda 200 antes de lanzar Playwright
      # (el `depends_on: service_healthy` del compose ya encadena el arranque,
      # pero confirmamos el 200 publico para no correr las pruebas demasiado pronto).
      - name: Esperar a que el frontend responda
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "Stack arriba."
              exit 0
            fi
            echo "Esperando al stack... ($i/60)"
            sleep 5
          done
          echo "El stack no respondio a tiempo."
          docker compose logs
          exit 1

      - name: Pruebas E2E (Playwright)
        working-directory: frontend
        run: npm run test:e2e

      # Diagnostico si algo fallo: vuelca logs de los tres servicios, ACOTADOS. Sin `--tail` el
      # volcado son miles de lineas de peticiones del backend que empujan la salida de Playwright
      # fuera de la ventana de log que la API de GitHub deja leer (un fallo de e2e quedaba
      # indepurable). Con el tope, el diagnostico sigue estando y el log sigue siendo legible.
      - name: Logs del stack (si fallo)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Reporte de Playwright (si fallo)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

      # Resumen COMPACTO de las pruebas fallidas, EL ULTIMO del job (y en el summary del run): asi
      # la lista de fallos con su error queda siempre en las ultimas lineas del log, pase lo que
      # pase con el volcado de arriba o con el artefacto.
      - name: Resumen de fallos de Playwright (si fallo)
        if: failure()
        working-directory: frontend
        run: |
          cat > /tmp/resumen-e2e.cjs <<'JS'
          const fs = require('node:fs');
          const RUTA = 'test-results/resultados.json';
          const sinAnsi = (t) => String(t).replace(/\u001b\[[0-9;]*m/g, '');
          if (!fs.existsSync(RUTA)) {
            console.log('## E2E: no hay ' + RUTA + ' (¿el paso de pruebas ni arrancó?)');
            process.exit(0);
          }
          const informe = JSON.parse(fs.readFileSync(RUTA, 'utf8'));
          const fallos = [];
          const recorrer = (suites) => {
            for (const suite of suites ?? []) {
              for (const spec of suite.specs ?? []) if (spec.ok !== true) fallos.push(spec);
              recorrer(suite.suites);
            }
          };
          recorrer(informe.suites);
          const s = informe.stats ?? {};
          console.log('## E2E — ' + fallos.length + ' prueba(s) fallida(s)');
          console.log('');
          console.log('esperadas: ' + (s.expected ?? '?') + ' · inesperadas: ' + (s.unexpected ?? '?') +
            ' · con reintento: ' + (s.flaky ?? '?') + ' · omitidas: ' + (s.skipped ?? '?'));
          for (const spec of fallos) {
            console.log('');
            console.log('### ✘ ' + spec.file + ':' + spec.line + ' › ' + spec.title);
            const resultados = (spec.tests ?? []).flatMap((t) => t.results ?? []);
            // `errors: []` NO es nullish: con `??` un resultado con la lista vacía y `error`
            // poblado imprimía el encabezado del spec SIN mensaje. Se mira la LONGITUD.
            const errores = resultados.flatMap((r) =>
              r.errors?.length ? r.errors : r.error ? [r.error] : [],
            );
            const visto = new Set();
            for (const error of errores) {
              const texto = sinAnsi(error.message ?? error.value ?? '').split('\n').slice(0, 25).join('\n');
              if (texto === '' || visto.has(texto)) continue;
              visto.add(texto);
              console.log('```');
              console.log(texto);
              console.log('```');
            }
          }
          JS
          node /tmp/resumen-e2e.cjs | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
