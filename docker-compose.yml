# docker-compose de CONTROL v2 — levanta TODO el stack con un comando.
#
#   docker compose up -d --build
#
# El entorno local replica produccion (PLANMAESTRO §2.1): solo el frontend
# publica un puerto al host; backend y postgres son privados y se alcanzan por
# nombre dentro de la red del compose. El arranque es ordenado por healthchecks:
# postgres healthy -> backend migra/siembra y queda healthy -> frontend (nginx).

services:
  # ── PostgreSQL 17 (privado) ────────────────────────────────────────────────
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: control
      POSTGRES_PASSWORD: control
      POSTGRES_DB: control_v2
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U control -d control_v2']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Backend Fastify (privado: sin puerto publicado al host) ────────────────
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      # El backend ya usa la BD (Prisma + adapter pg). Al arrancar aplica las
      # migraciones (migrate deploy) y, con SEED_ON_START=true, siembra los datos
      # de fundación (FR Moda + permisos + roles + admin) — todo idempotente.
      DATABASE_URL: postgresql://control:control@postgres:5432/control_v2
      SEED_ON_START: 'true'
      # Autenticacion (better-auth, E3). En local basta un secreto fijo; en
      # produccion (Railway) se inyecta uno fuerte por variable de entorno.
      BETTER_AUTH_SECRET: secreto-de-desarrollo-local-cambiar-en-produccion
      BETTER_AUTH_URL: http://localhost:8080
      # Cap alto de logins/min por IP para e2e/local (toda la suite loguea desde
      # una IP); prod usa el default 20 (Railway no setea esta variable).
      AUTH_LOGIN_RATE_MAX: '1000'
      # Cloudflare R2 (archivos, F0). Valores DUMMY para local/CI: el firmado de
      # las URLs prefirmadas (presigned PUT/GET) es 100% local y NO contacta a R2,
      # asi que con estos basta para que el flujo de adjuntos (F1-E1B) funcione sin
      # un R2 real (el E2E mockea el PUT). En produccion (Railway) se inyectan los
      # valores reales por variable de entorno.
      R2_ACCOUNT_ID: dev
      R2_ACCESS_KEY_ID: dev
      R2_SECRET_ACCESS_KEY: dev
      R2_BUCKET: control-v2-dev
      # Subida SERVER-SIDE en modo LOCAL (no-op) para dev/CI: la importacion de CFDI
      # (F9-E3) sube el XML desde el servidor (no presigned), y con R2 dummy un
      # PutObject real fallaria. En modo local se salta la red y solo devuelve la
      # key. En produccion (Railway) NO se setea -> subida real a R2.
      R2_SUBIDA_LOCAL: 'true'
      # Segundo respaldo cifrado a R2 (V1-E6a): APAGADO en local/CI a proposito. No
      # hay un R2 real donde subir (las credenciales de arriba son dummy) y volcar
      # la base en cada `docker compose up` no aporta nada. Con esto el arranque lo
      # dice una vez y sigue; sin esto, el guard lo dejaria anotado como fallo de
      # configuracion en cada arranque. En Railway NO se setea (o se pone "true") y
      # ahi si se exigen RESPALDO_LLAVE y las credenciales R2 reales.
      RESPALDO_ACTIVO: 'false'
    # Healthcheck con node (no depende de herramientas del sistema): solo pasa a "healthy" cuando
    # /api/health responde 200. Durante migrate deploy + seed (corren ANTES de
    # arrancar el server) la sonda recibe conexion rechazada porque el server aun
    # no escucha -> exit 1 -> "starting"; el 503 de /api/health solo aplica cuando
    # el server YA esta arriba pero la BD no responde. Asi el frontend no arranca
    # antes de tiempo y se elimina el "502 Bad Gateway" del arranque.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      # start_period holgado: cubre migrate deploy + seed antes de contar fallos.
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend nginx (publico: unico expuesto al host) ───────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - '8080:80'
    # Espera a que el backend este HEALTHY (no solo "started"): nginx empieza a
    # proxyar /api cuando el backend ya responde, evitando el 502 de arranque.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos_postgres:
