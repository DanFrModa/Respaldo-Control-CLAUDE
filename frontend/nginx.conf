# nginx del frontend de CONTROL v2.
#
# Hace dos cosas:
#   1. Sirve los estaticos del SPA (build de Vite) con fallback a index.html
#      para que el ruteo del lado del cliente funcione.
#   2. Reenvia /api/ al servicio backend por la red interna (sin exponer el
#      backend a internet). En produccion Railway el target cambia al nombre
#      interno del backend; aqui es el nombre del servicio en docker-compose.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No cachear el HTML de entrada: siempre debe traer el ultimo bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy de la API hacia el backend (servicio "backend", puerto 3000).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida devuelve index.html (ruteo en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
